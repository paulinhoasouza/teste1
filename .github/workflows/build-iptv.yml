name: Build IPTV Player TV APK
on:
  push:
    branches: [iptv-apk-build]
    paths:
      - 'iptv-source.tar.gz.b64'
      - '.github/workflows/build-iptv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d iptv-source.tar.gz.b64 | tar -xz
          test -f app/build.gradle.kts
          sed -i -e "s/2026.09.00/2025.12.00/g" -e "s/activity-compose:1.13.0/activity-compose:1.11.0/g" -e "s/activity-ktx:1.13.0/activity-ktx:1.11.0/g" -e "s/2.11.0/2.9.4/g" -e "s/1.11.1/1.9.3/g" app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fLsS --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/android-cmd.zip
          unzip -q /tmp/android-cmd.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Check APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk > /dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          grep -q "package: name='com.example.iptvplayertv'" apk-badging.txt
      - name: Publish standalone APK on build branch
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/IPTV-Player-TV-v0.5.0-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/IPTV-Player-TV-v0.5.0-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publish IPTV Android TV APK [skip ci]'
            git push origin HEAD:iptv-apk-build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-TV-v0.5.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
